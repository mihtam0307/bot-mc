name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bay-bot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Bầy Bot (bản mới nhất)" --notes "APK build tự động từ commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
